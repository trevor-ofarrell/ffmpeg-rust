# Prior update: The shared pixel model covers FFmpeg 8.1.1 high-bit packed YUV 4:2:2 names y210le/be, y212le/be, and y216le/be. They are modeled as one packed four-byte-per-pixel plane with log2 chroma (1,0), even-width validation, 10/12/16-bit component descriptors, FFmpeg logical average bpp values of 20/24/32, and local unit plus fuzz-build coverage for names, descriptors, frame sizes, plane splitting, line sizing, and invalid-width validation.
