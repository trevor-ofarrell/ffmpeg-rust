# Prior update: The shared pixel model covers FFmpeg 8.1.1 high-bit semi-planar P-family names p010le/be, p012le/be, p016le/be, p210le/be, p212le/be, p216le/be, p410le/be, p412le/be, and p416le/be. They are modeled as two-plane YUV formats with one luma plane, one interleaved chroma plane, two stored bytes per component sample, 10/12/16-bit component descriptors, and 4:2:0, 4:2:2, or 4:4:4 chroma geometry. Local unit and fuzz-build coverage now checks names, descriptors, frame sizes, plane splitting, line sizing, and invalid chroma geometry where FFmpeg's descriptor geometry requires it.
