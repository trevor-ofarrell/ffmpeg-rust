# Latest avutil-packet evidence: `packet:fifo-write-user-move-*`,
# `packet:fifo-read-user-move-*`, `packet:fifo-write-user-ref-*`, and
# `packet:fifo-read-user-ref-*` now prove pinned FFmpeg 8.1.1's
# packet-specialized `AVContainerFifo` passes `AV_CONTAINER_FIFO_FLAG_USER`
# through without changing packet transfer semantics: USER alone still moves,
# while REF|USER still references.
# Latest avutil-packet evidence: `packet:rescale-negative-near-inf-rounding`
# now proves pinned FFmpeg 8.1.1 `av_packet_rescale_ts()` rounds a negative
# half-tick PTS away from zero and a negative below-half DTS toward zero while
# preserving payload, position, flags, stream index, and `time_base`.
# Latest avutil-packet evidence: `packet:rescale-near-inf-rounding` now
# proves pinned FFmpeg 8.1.1 `av_packet_rescale_ts()` uses nearest-away
# rounding for fractional PTS/DTS/duration rescale while preserving payload,
# position, flags, stream index, and `time_base`.
# Latest avutil-packet evidence: `packet:rescale-negative-ts` now proves
# pinned FFmpeg 8.1.1 `av_packet_rescale_ts()` rescales negative PTS/DTS and
# positive duration fields while preserving payload, position, flags, stream
# index, and `time_base`.
# Latest avutil-packet evidence: `packet:rescale-zero-duration` now proves
# pinned FFmpeg 8.1.1 `av_packet_rescale_ts()` rescales valid PTS/DTS while
# preserving a zero duration field, and leaves packet payload, byte position,
# flags, stream index, and `time_base` unchanged.
# Latest avutil-packet evidence: `packet:rescale-mixed-dts` now proves pinned
# FFmpeg 8.1.1 `av_packet_rescale_ts()` preserves `AV_NOPTS_VALUE` DTS while
# rescaling valid PTS and duration fields, and leaves packet payload, byte
# position, flags, stream index, and `time_base` unchanged.
# Latest avutil-packet evidence: `packet:rescale-mixed` now proves pinned
# FFmpeg 8.1.1 `av_packet_rescale_ts()` preserves `AV_NOPTS_VALUE` PTS while
# rescaling valid DTS and duration fields, and leaves packet payload, byte
# position, flags, stream index, and `time_base` unchanged.
# Latest avutil-packet evidence: `packet:payload-grow-invalid-*` rows now
# prove pinned FFmpeg 8.1.1 `av_grow_packet()` returns ENOMEM before mutation
# when `grow_by` exceeds `INT_MAX - (pkt->size +
# AV_INPUT_BUFFER_PADDING_SIZE)`. Rust `Packet::grow_data` now enforces the
# same boundary without attempting a huge allocation, and the unit plus
# `avutil_core_models` fuzz-model invariants cover no-mutation behavior.
# Latest avutil-packet evidence: `packet:payload-from-data-invalid-*` rows now
# prove pinned FFmpeg 8.1.1 `av_packet_from_data()` returns EINVAL before
# mutation when `size >= INT_MAX - AV_INPUT_BUFFER_PADDING_SIZE`. Rust
# `Packet::from_data`, `Packet::replace_data_from_vec`, and
# `Packet::new_zeroed` now share the same safe payload-length guard through
# `Packet::validate_payload_len`, with unit and `avutil_core_models`
# fuzz-model boundary checks.
# Latest avutil-packet evidence: `packet:payload-make-refcounted-readonly-*`
# and `packet:payload-make-writable-readonly-*` rows now prove an existing
# read-only `AVBufferRef` stays attached/non-writable through
# `av_packet_make_refcounted()`, then detaches to writable padded storage
# through `av_packet_make_writable()`.
# Latest ffprobe MOV evidence: a generated two-frame RGB24 MOV oracle row now
# compares selected default-output fields from Rust ffprobe-rs against pinned
# FFmpeg 8.1.1 ffprobe for format counts/name/duration/size/probe score,
# stream codec/tag/dimensions/timing/count fields, and packet timing/size/K__
# flags. The mapped fftools-ffprobe rows advanced to differential_pass, not
# complete, because tags, field-order/id/pos/disposition deltas, JSON byte
# identity, broader formats, FATE coverage, and fuzz/invalid-input closure
# remain pending.
# Latest avutil-packet evidence: `packet:unref-empty` and
# `packet:unref-repeat` rows now prove pinned FFmpeg 8.1.1
# `av_packet_unref()` resets an already-empty allocated packet and remains
# idempotent after releasing a populated packet. Rust unit and
# `avutil_core_models` fuzz-model invariants cover the same reset shape.
# Latest rawvideo/AVI evidence: the ignored rawvideo oracle harness now
# compares bounded raw `bgr24` input to `-f avi` output against pinned FFmpeg
# 8.1.1 `-c:v rawvideo -f avi` output after demuxing both AVI files through
# the Rust demuxer. This proves the current AVI path's zero stream handler,
# `00dc` packet chunks, top-down-height demuxing, and 4-byte DIB scanline
# padding exposed in packet payloads.
# Latest image2 evidence: the ignored image2 oracle harness now compares valid
# bounded PPM single-image and numbered-sequence `-f image2` file-output
# streamcopy paths against pinned FFmpeg 8.1.1 `-c:v copy -f image2`, plus
# single-image and numbered-sequence `-f framecrc` streamcopy rows, proving
# byte-preserving packet transfer and bounded packet-record parity through the
# current Image2 demuxer, Packet path, Image2 muxer, and FrameCrc muxer for
# those constrained rows.
# Latest framecrc/rawvideo evidence: `FrameCrcMuxer` now emits FFmpeg-style
# packet record rows using the framecrc Adler-style checksum initialized at
# zero. The ignored rawvideo oracle harness compares normalized `rgb24`
# `-f framecrc -` rows against pinned FFmpeg streamcopy output, proving packet
# count, PTS, DTS, duration, size, and checksum for that bounded media path.
# Latest framehash/rawvideo evidence: `FrameHashMuxer` now emits FFmpeg-style
# frame checksum rows ordered as stream, DTS, PTS, duration, size, digest. The
# ignored rawvideo oracle harness compares normalized `rgb24` `-f framehash -`
# and `-f framemd5 -` rows against pinned FFmpeg streamcopy output.
# Latest streamhash/rawvideo evidence: `StreamHashMuxer` now has a pinned
# rawvideo oracle row comparing normalized `rgb24` `-f streamhash -` streamcopy
# rows against FFmpeg output, proving the bounded stream index/type/hash line.
# Latest hash/md5 rawvideo evidence: `HashMuxer` now has pinned rawvideo oracle
# rows comparing bounded `rgb24` `-f hash -` and `-f md5 -` streamcopy output
# against FFmpeg, proving whole-output SHA-256 and MD5 packet-data digest lines
# through the Rust rawvideo demuxer, Packet path, and hash muxer.
# Latest PCM media evidence: a new ignored raw PCM oracle harness compares
# bounded `pcm_s16le` streamcopy output to pinned FFmpeg for `-f framecrc -`
# rows and raw `-f s16le` file output, proving audio packet timing, duration,
# size, checksum, and byte-preserving mux output through the Rust packet path.
# Latest WAV media evidence: the generated and sample-backed WAV-to-MD5
# oracle rows are now mapped to `avutil-packet`, proving the Rust WAV demuxer
# -> Packet -> md5 muxer path against pinned FFmpeg streamcopy output for both
# a bounded generated PCM s16le WAV fixture and the installed FATE WAV sample.
# Latest avutil-packet evidence: default-native ABI layout rows now prove
# pinned FFmpeg 8.1.1 `AVPacketSideData`, `AVPacket`, and deprecated
# `AVPacketList` sizes, alignments, field offsets, and field sizes through C
# `sizeof`, `_Alignof`, and `offsetof` rows. Rust exposes matching
# `PacketAbiLayout` metadata for the selected x86_64 oracle profile.
# Earlier avutil-packet evidence: packet/frame side-data bridge map-inventory
# rows now prove all 11 pinned FFmpeg 8.1.1 global packet/frame side-data
# mappings in both directions while preserving expected kind order and payload
# bytes. Unit, differential, upstream `fate-avpacket`, and
# `avutil_core_models` fuzz-smoke coverage passed for this slice.
# Earlier avutil-packet evidence: packet/frame side-data bridge rows now prove
# pinned FFmpeg 8.1.1 combined `AV_FRAME_SIDE_DATA_FLAG_UNIQUE |
# AV_FRAME_SIDE_DATA_FLAG_REPLACE` behavior. Frame-to-packet still replaces
# the first matching packet side-data entry and preserves later duplicates;
# packet-to-frame follows frame-side UNIQUE precedence by removing matching
# frame side data, preserving nonmatching entries, and appending the mapped
# replacement.
# Earlier avutil-packet evidence: packet-owned `av_packet_add_side_data()`
# capacity-failure ownership rows now prove pinned FFmpeg 8.1.1 returns
# ERANGE for a new kind at `AV_PKT_DATA_NB` capacity while preserving the
# caller-owned buffer. Rust `Packet::try_add_side_data_owned` now transfers
# ownership only after the capacity check succeeds; unit and
# `avutil_core_models` coverage assert success consumption and failure
# preservation.
# Earlier avutil-packet evidence: standalone `AVPacketSideData` flag rows prove
# pinned FFmpeg 8.1.1 ignores nonzero flags for both
# `av_packet_side_data_new()` and `av_packet_side_data_add()`; the former
# succeeds after caller-initialized allocation bytes, and the latter replaces
# the first matching type while transferring caller ownership.
# Earlier avutil-packet evidence: multi-key dictionary packing has pinned
# `av_packet_pack_dictionary()` / `av_packet_unpack_dictionary()` rows proving
# duplicate AVDictionary entries are serialized in order and unpack collapse
# follows FFmpeg's case-insensitive replacement shape.
# Earlier avutil-packet evidence: property-preserving `av_packet_from_data()`
# data/size/buf replacement rows, zero-size side-data add rows, shared
# refcounted payload grow rows, already-refcounted payload make-refcounted
# and make-writable no-op rows, packet-to-frame and frame-to-packet
# `AV_FRAME_SIDE_DATA_FLAG_UNIQUE` bridge rows, empty standalone side-data
# array no-op rows, packet-owned side-data size-null lookup rows,
# duplicate side-data copy/ref/clone collapse and move-ref transfer rows,
# packet-owned duplicate side-data get/new/add/shrink/free rows,
# standalone duplicate side-data lookup/new/add/remove/free rows, and standalone side-data
# array capacity-divergence rows now pass through the packet oracle,
