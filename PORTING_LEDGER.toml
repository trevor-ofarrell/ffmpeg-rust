# Latest fuzz execution: WSL `cargo fuzz run avutil_core_models -- -runs=1` passes locally after correcting stale low-bit RGB logical-bpp expectations in the deterministic fuzz table.
# Latest update: the ignored ffmpeg -pix_fmts oracle harness now includes PixelFormat::HARDWARE identity rows and validates FFmpeg's ..H.. flag plus zero component/bpp/BIT_DEPTHS metadata for vaapi, dxva2_vld, vdpau, qsv, mmal, d3d11va_vld, cuda, videotoolbox_vld, mediacodec, d3d11, drm_prime, opencl, vulkan, d3d12, amf, and ohcodec.
# Prior update: the ignored ffmpeg -pix_fmts oracle harness runs locally through the pinned WSL oracle wrapper, accepts FFmpeg 8.1.1's BIT_DEPTHS column, and checks that every current Rust PixelFormat::ALL descriptor name exists with matching component count, integer bits-per-pixel when exactly modeled, and paletted flag. It is a subset inventory check, not full AVPixFmtDescriptor parity or full FFmpeg pixel inventory parity.
# Latest update: The shared pixel model covers FFmpeg 8.1.1 MSB-aligned planar 10/12-bit YUV444 and GBR names yuv444p10msble/be, yuv444p12msble/be, gbrp10msble/be, and gbrp12msble/be. They are modeled as three full-resolution planes, two stored bytes per component sample, valid bits in the high bits with low bits reserved as zero by FFmpeg, 10/12-bit component descriptors, 30/36 logical bpp, YUV or RGB class metadata, local unit coverage for names/descriptors/frame sizes/plane splitting/line sizing/invalid payload lengths, and fuzz-build invariants across avutil, avcodec, avformat rawvideo, rawvideo muxing, and the constrained rawvideo/null CLI path. A descriptor-name comparison against pinned FFmpeg 8.1.1 pixdesc now leaves only hardware-only descriptor names unmatched in the Rust shared PixelFormat inventory.
# Prior update: The shared pixel model covers FFmpeg 8.1.1 packed 32-bit integer RGB/RGBA names rgb96le/be and rgba128le/be. They are modeled as one RGB-class packed integer payload plane with no chroma subsampling, 32-bit component descriptors, 96/128 logical bpp, twelve/sixteen stored bytes per pixel, alpha only for rgba128*, local unit coverage for names/descriptors/frame sizes/plane splitting/line sizing/invalid payload lengths, and fuzz-build invariants across avutil, avcodec, avformat rawvideo, rawvideo muxing, and the constrained rawvideo/null CLI path. Source checking also confirmed that AV_PIX_FMT_Y410/Y412/Y416 are not real FFmpeg 8.1.1 descriptors.
# Prior update: The shared pixel model covers FFmpeg 8.1.1 packed floating RGBA names rgbaf16le/be and rgbaf32le/be. They are modeled as one RGB-class packed float payload plane with alpha metadata, log2 chroma (0,0), 16/32-bit component descriptors, 64/128 logical bpp, eight/sixteen stored bytes per pixel, local unit coverage for names/descriptors/frame sizes/plane splitting/line sizing/invalid payload lengths, and fuzz-build invariants across avutil, avcodec, avformat rawvideo, rawvideo muxing, and the constrained rawvideo/null CLI path.
# Prior update: The shared pixel model covers FFmpeg 8.1.1 packed floating RGB names rgbf16le/be and rgbf32le/be. They are modeled as one RGB-class packed float payload plane with no alpha, log2 chroma (0,0), 16/32-bit component descriptors, 48/96 logical bpp, six/twelve stored bytes per pixel, local unit coverage for names/descriptors/frame sizes/plane splitting/line sizing/invalid payload lengths, and fuzz-build invariants across avutil, avcodec, avformat rawvideo, rawvideo muxing, and the constrained rawvideo/null CLI path.
# Prior update: The shared pixel model covers FFmpeg 8.1.1 planar floating GBR names gbrpf16le/be and gbrpf32le/be. They are modeled as three full-resolution RGB-class planar float payload planes with no alpha, log2 chroma (0,0), 16/32-bit component descriptors, 48/96 logical bpp, two/four stored bytes per sample, local unit coverage for names/descriptors/frame sizes/plane splitting/line sizing/invalid payload lengths, and fuzz-build invariants across avutil, avcodec, avformat rawvideo, rawvideo muxing, and the constrained rawvideo/null CLI path.
# Prior update: The shared pixel model covers FFmpeg 8.1.1 packed UYYVYY411 as `uyyvyy411`. It is modeled as one packed YUV-class plane with three 8-bit exposed components, no alpha, log2 chroma (2,0), 12 logical bpp, no scalar bytes-per-pixel because each 6-byte group stores 4 pixels, and `ceil(width / 4) * 6` line sizing that accepts partial final four-pixel groups. Local unit coverage checks names/descriptors/frame sizes/plane splitting/line sizing/invalid payload lengths, and fuzz-build invariants cover avutil, avcodec, avformat rawvideo, rawvideo muxing, and the constrained rawvideo/null CLI path.
