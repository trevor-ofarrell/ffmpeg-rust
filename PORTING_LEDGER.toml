# rows: default nonzero-left crop is rounded down to preserve the 32-byte data
# pointer alignment rule, `AV_FRAME_CROP_UNALIGNED` applies the exact one-byte
# left offset, and the palette plane offset remains zero in the pinned
# `calc_cropping_offsets()` path. Rust unit, oracle, local FATE,
