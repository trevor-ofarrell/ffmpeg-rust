# Prior update: The shared pixel model covers FFmpeg 8.1.1 packed X/V YUV 4:4:4 names xv30le/be, xv36le/be, xv48le/be, and v30xle/be. They are modeled as one packed YUV plane with three exposed components, no alpha, log2 chroma (0,0), 30/36/48 logical bpp, four/six/eight stored bytes per pixel, undefined X-lane storage padding, local unit coverage for names/descriptors/frame sizes/plane splitting/line sizing/invalid payload lengths, and fuzz-build invariants across avutil, avcodec, avformat rawvideo, rawvideo muxing, and the constrained rawvideo/null CLI path.
# Prior update: The shared pixel model covers FFmpeg 8.1.1 packed floating gray+alpha names yaf16le/be and yaf32le/be. They are modeled as one packed plane with two components, alpha and float metadata, log2 chroma (0,0), 32/64 logical bpp, four/eight stored bytes per pixel, local unit coverage for names/descriptors/frame sizes/plane splitting/line sizing/invalid payload lengths, and fuzz-build invariants across avutil, avcodec, avformat rawvideo, rawvideo muxing, and the constrained rawvideo/null CLI path.
# Prior update: The shared pixel model covers FFmpeg 8.1.1 packed 8-bit YUV/YUVA names vuya, vuyx, ayuv, uyva, and vyu444. They are modeled as one packed plane with log2 chroma (0,0): vuya/ayuv/uyva expose four 8-bit components with alpha and four stored bytes per pixel, vuyx exposes three components with 24 logical bpp and four stored bytes per pixel, and vyu444 exposes three components with three stored bytes per pixel. Local unit coverage checks names, descriptors, frame sizes, plane splitting, line sizing, invalid payload lengths, and fuzz-build invariants across avutil, avcodec, avformat rawvideo, and rawvideo muxing.
# Prior update: The shared pixel model covers FFmpeg 8.1.1 packed 10-bit RGB/BGR names x2rgb10le/be and x2bgr10le/be. They are modeled as one packed four-byte-per-pixel RGB-class plane with three 10-bit color components, log2 chroma (0,0), 30 logical bpp, no alpha semantics, local unit coverage for names/descriptors/frame sizes/plane splitting/line sizing/invalid payload lengths, and fuzz-build invariants across avutil, avcodec, avformat rawvideo, and rawvideo muxing.
# Prior update: The shared pixel model covers FFmpeg 8.1.1 packed XYZ names xyz12le and xyz12be. They are modeled as one packed six-byte-per-pixel XYZ plane with a distinct XYZ class, three 12-bit components, log2 chroma (0,0), 36 logical bpp, local unit coverage for names/descriptors/frame sizes/plane splitting/line sizing/invalid payload lengths, and fuzz-build invariants across avutil, avcodec, avformat rawvideo, and rawvideo muxing.
