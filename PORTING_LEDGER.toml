notes = "Version/buildconf command support exists but is not byte-identical to upstream. The Rust version banner uses FFmpeg-shaped dual library ABI lines (`current / configured`) and reports the pinned target version/profile, while keeping Rust-specific build text. The Rust `-buildconf` path reports the selected default-native configure flag surface as an FFmpeg-shaped indented configuration block without the normal version line or library table; it also mirrors the pinned oracle's preemptive `-buildconf` shape where unknown trailing options do not make the request fail. The pinned FFmpeg 8.1.1 oracle is installed locally through WSL wrappers under ignored third_party/ffmpeg-oracle/, and the differential harness runs pinned ffmpeg/ffprobe -version, checks the target 8.1.1 first-line version prefix, compares the reported libav* ABI versions against the Rust banner constants, verifies that `-hide_banner -version` prints the same version surface as `-version`, verifies that GNU-style `--version` is not a clean successful version request, and verifies the `-buildconf` configuration-block shape plus unknown-option preemption for both tools. The buildconf row compares shape rather than exact configure flags because the Rust implementation reports the selected compatibility profile while the local WSL oracle wrapper includes bootstrap-local `--prefix` and `--disable-x86asm` flags. `cargo run -p fate-runner -- run --mappings tests/differential/mappings.txt --component fftools-version --target oracle-ffmpeg-version --target oracle-ffprobe-version --target oracle-double-dash-version-rejection --target oracle-hide-banner-version --target oracle-buildconf-surface --oracle-ffmpeg ./third_party/ffmpeg-oracle/build/bin/ffmpeg.cmd` passed. It derives ffprobe from FFPROBE_ORACLE, a sibling of FFMPEG_ORACLE, or the standard third_party oracle path including the generated ffmpeg.cmd/ffprobe.cmd wrappers; env-provided relative oracle paths are resolved against the repository root in the version oracle harness. WSL process checks for `ffmpeg-rs -version`, `ffprobe-rs -version`, `ffmpeg-rs --version`, and `ffprobe-rs --version` passed, with the double-dash forms exiting nonzero. The bootstrap script now emits .cmd oracle wrappers that propagate WSL exit codes for future installs. The local FATE-runner smoke mappings execute version and buildconf unit filters only and do not count as upstream FATE parity."
