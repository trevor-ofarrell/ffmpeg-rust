# Complete: default-native libavutil error parity is proven by local unit tests, a pinned libavutil av_strerror differential oracle, FATE inapplicability documentation, and fuzz-model build checks.
notes = "Complete for the selected ffmpeg-8.1.1-default-native profile. The runtime Rust model has stable kind/message accessors, common constructors, FFmpeg-style AvErrorCode metadata for documented tag-based libavutil/error.h constants, POSIX AVERROR(errno) constants used by the default WSL/Linux oracle profile, custom code preservation, IO ErrorKind classification, optional preserved io::ErrorKind metadata, and an EOF predicate. AvErrorCode exposes pinned FFmpeg 8.1.1 AVERROR_LIST descriptions and the validated POSIX errno subset through av_error_description/av_strerror/av_make_error_string helpers, including BUG2 sharing BUG's string, INPUT_CHANGED | OUTPUT_CHANGED resolving to the first matching INPUT_CHANGED string because the combined raw code duplicates INPUT_CHANGED under FFmpeg's signed bitwise behavior, and unknown codes rendering the FFmpeg-shaped `Error number <n> occurred` fallback. The ignored error_oracle differential harness compiles a test-only C helper against pinned third_party/ffmpeg-oracle/wsl/lib/libavutil.a and compares AV_ERROR_MAX_STRING_SIZE, FFmpeg-defined AVERROR_* raw values, POSIX AVERROR(errno) raw values, and av_strerror strings against the Rust model. Constructor and IO mapping tests provide invalid/error-input coverage for unknown raw codes and representative io::ErrorKind mappings. The avutil_core_models fuzz target build-checks constructor invariants, FFERRTAG-style code values, pinned error-string table lookups, generic unknown-code strings, POSIX errno code mappings, custom code preservation, IO mapping, preserved IO kind metadata, and EOF classification. avutil-error does not parse untrusted byte streams, so long-running cargo-fuzz execution is not required for completion. Upstream FFmpeg FATE has no standalone libavutil error-string API target; this row documents that exception and uses the local FATE-runner smoke mapping plus pinned libavutil differential oracle as completion evidence."
blocked_reason = ""

