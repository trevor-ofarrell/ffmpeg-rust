notes = "Initial MOV/MP4 demuxer validates classic, extended-size, and size-zero boxes; parses ftyp, mvhd, tkhd, mdhd language metadata, and mdia/hdlr handler type plus handler-name metadata; extracts common movie-level and track-level udta/meta/ilst data values for UTF-8 and UTF-16 text fields, classic gnre genre indexes, one-byte integer/boolean atoms, iTunes-style freeform ---- atoms, covr cover-art payloads, and track/disc number pairs while rejecting malformed metadata atoms, invalid text encodings, malformed hdlr names, malformed genre indexes, short integer/boolean payloads, malformed freeform payloads, and short cover-art data payloads; registers a hand-written ftyp/extension/MIME probe descriptor; records generic stsd codec parameters with codec tag, data reference index, and sample-entry extra data; parses AudioSampleEntry version/revision/vendor/base channel-count/sample-size/compression-id/packet-size/sample-rate/child boxes for known audio sample-entry tags including samr/sawb, including version-1 samples-per-packet/bytes-per-packet/bytes-per-frame/bytes-per-sample fields, version-2 sizeOfStructOnly/audioSampleRate/numAudioChannels/constBitsPerChannel/formatSpecificFlags/constBytesPerAudioPacket/constLPCMFramesPerAudioPacket fields, direct esds full-box descriptor payloads, btrt buffer-size/max-bitrate/average-bitrate fields, damr AMR vendor/decoder-version/mode-set/mode-change-period/frames-per-sample fields, mandatory Opus dOps version/output-channel-count/pre-skip/input-sample-rate/output-gain/channel-mapping-family fields plus optional stream-count/coupled-count/channel-mapping tables for Opus sample entries, structured wave extension atoms with nested frma original format, esds full-box descriptor payload, and terminator validation, and structured chan channel-layout atoms with channel layout tag, bitmap, labels, flags, and coordinate bits; parses tx3g timed-text sample-entry display/default-box/default-style fields and child boxes; parses metx/mett metadata sample-entry null-terminated content-encoding, namespace/schema-location, and MIME-format strings; parses VisualSampleEntry width, height, frame count, compressor name, depth, child boxes, structured avcC version/profile/level/NAL-length-size/SPS/PPS data, structured hvcC profile/timing/NAL-length-size/NAL-array data, pasp pixel aspect ratio, and nclx/nclc/rICC/prof colr color information for known video sample entries and raw entries with full visual payloads; explicitly rejects fragmented mvex/moof layouts, edit-list edts boxes, multiple populated tracks, multiple stsd sample entries, and sample description indexes other than 1; parses simple stsd/stts/ctts/stsc/stsz/stss/stco/co64 tables for one populated track including multi-chunk stsc transitions and sample ranges split across multiple mdat boxes; emits packets with PTS/DTS/duration, key flags, and side data; and rejects malformed sample tables, unknown/truncated AudioSampleEntry versions, invalid version-2 struct offsets or sample rates, malformed direct AudioSampleEntry esds, btrt, damr, or dOps payloads, duplicate or missing required Opus dOps boxes, malformed AudioSampleEntry wave/frma/esds/terminator data, malformed chan version/flags/descriptor payloads, malformed AudioSampleEntry child boxes, malformed tx3g/metx/mett sample-entry payloads, malformed VisualSampleEntry child boxes, malformed avcC/hvcC/pasp/colr payloads, and truncated media data. Build-checked cargo-fuzz target avformat_mov exercises box parsing, sample-table packet extraction, stream metadata, packet timing, and side-data invariants, but actual local fuzz execution is blocked until cargo-fuzz is installed. Packet extraction for multiple populated tracks, actual fragment parsing, edit-list timeline application, additional codec-specific audio extensions beyond direct esds/btrt/damr/dOps/wave/chan, broader subtitle/data sample-entry coverage, deeper VPS/SPS/PPS bitstream validation, CLI wiring, differential tests, and FATE are pending."
