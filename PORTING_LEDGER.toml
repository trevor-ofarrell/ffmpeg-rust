notes = '''Frame skeleton validates required audio/video shape and exact plane sizes through the shared initial PixelFormat and SampleFormat models, reports tightly packed per-plane line sizes for the current audio/video format subset, stores optional PTS, can retain BufferRef-backed FrameSideData payloads with per-side-data Dictionary metadata, and can retain an optional AVFrame.hw_frames_ctx-shaped BufferRef with clone/take/replace/drop lifetime behavior. FrameData has an explicit Empty state for unreferenced frames, and Frame supports empty/default construction, unref(), ref_from(), and move_ref_from() to clear, clone/share, or move all current frame references while preserving BufferRef release timing.

