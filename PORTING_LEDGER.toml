ied or nested ambisonic extras. Previous addition: ChannelLayoutSpec now has a first-class Custom variant and parse() wires bounded FFmpeg parse_channel_list-style `CH[@name]+...` strings into custom-order specs when they cannot be canonically retyped to Native, NativeMask, or Unspecified. Named maps such as `FL@Left+FR@Right`, escaped/custom-name maps such as `FL@Left\\+Right+FR` and `FL@Left\\@Name+FR`, repeated-at custom names such as `FL@Left@Again`, duplicate native IDs such as `FL+FL`, trailing-separator lists such as `FL+`, quoted channel IDs such as `'FL'+FR`, and mixed raw-ID maps with UNK, UNSD, AMBI<n>, and USR<raw> can now be represented through ChannelLayoutSpec with custom descriptions, index lookup, subset masks, validation, and native/custom equivalence helpers; nameless strictly ordered native maps still reduce to native layouts or exact NativeMask values, and all-UNK nameless maps reduce to count-only Unspecified. Previous addition: CustomChannelLayout::parse_channel_list parses the bounded FFmpeg parse_channel_list-style `CH[@name]+...` token shape into AVChannelCustom-style entries, including FFmpeg whitespace trimming, implicit keys, single-quoted token segments, backslash-escaped separators, unescaped `@` inside custom names after the first key separator, accepted trailing `+` separators, native channel IDs, UNK, UNSD, AMBI<n>, USR<raw>, optional 15-byte names, duplicate raw IDs, custom descriptions, and typed invalid-token/name rejection. Previous addition: ChannelLayoutSpec::parse mirrors the source-checked parse_channel_list path for the bounded native-channel subset by accepting native channel lists that do not map to a named layout, such as `FL`, `FL+FC`, and `2 channels (FL+FC)`, and preserving them as NativeMask layouts with exact bitmasks and count validation. Previous addition: NativeChannelMaskLayout models FFmpeg native-order layouts whose mask is not one of the currently modeled named layouts: it preserves every nonzero u64 mask bit