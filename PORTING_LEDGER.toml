oke, and pinned-oracle evidence for packet-owned AVPacket side-data capacity, replacement-at-capacity, ERANGE append failure without mutation, and av_packet_new_side_data NULL return at capacity. Latest FIFO correction: PacketFifo has unit, fuzz-smoke, and pinned-oracle evidence that empty packet FIFO reads return EINVAL and leave the destination packet empty. Prior FIFO addition: PacketFifo has unit, fuzz-smoke, and pinned-oracle evidence for packet-specialized AVContainerFifo move/ref transfer semantics, source reset/preservation, read draining, peek without mutation, drain, invalid peek EINVAL, and invalid drain EINVAL. Prior zero-size side-data addition: Packet::new_side_data and PacketSideDataList::new_side_data have unit, fuzz-smoke, and pinned-oracle evidence that zero-size AV_PKT_DATA_NEW_EXTRADATA entries are accepted and retained. Prior picture-type addition: PacketPictureType has unit, fuzz-smoke, and pinned-oracle evidence for AV_PICTURE_TYPE_* numeric values 0..=7 and display chars ?/I/P/B/S/i/p/b from av_get_picture_type_char(). Prior flag inventory addition: PacketFlags constants have unit, fuzz-smoke, and pinned-oracle evidence for KEY=0x0001, CORRUPT=0x0002, DISCARD=0x0004, TRUSTED=0x0008, DISPOSABLE=0x0010, and all=0x001f. Prior side-data API addition: Packet::shrink_side_data_by_kind_id models av_packet_shrink_side_data's missing-side-data ENOENT and oversize ENOMEM returns without mutating existing side data; the oracle expected rows include those invalid-input vectors. Packet::new_side_data models av_packet_new_side_data by allocating safe Rust initialized payload bytes, replacing the first matching side-data kind, and returning the new mutable entry; the oracle expected rows use it for the existing av_packet_new_side_data allocation and replacement vectors while not requiring stable FFmpeg allocator bytes before caller writes. Typed packet side-data parsers/constructors currently cover AV_PKT_DATA_PALETTE, AV_PKT_DATA_NEW_EXTRADATA, AV_PKT_DATA_H263_MB_INFO, AV_PKT_DATA_QUALITY_STATS, AV_PKT_DATA_FALLBACK_TRACK, AV_PKT_DATA_CPB_PROPERTIES, AV_PKT_DATA_PRFT, AV_PKT_DATA_RTCP_SR, AV_PKT_DATA_MASTERING_DISPLAY_METADATA, AV_PKT_DATA_SPHERICAL, AV_PKT_DATA_CONTENT_LIGHT_LEVEL, AV_PKT_DATA_AMBIENT_VIEWING_ENVIRONMENT, AV_PKT_DATA_3D_REFERENCE_DISPLAYS, AV_PKT_DATA_EXIF, AV_PKT_DATA_A53_CC, AV_PKT_DATA_ENCRYPTION_INIT_INFO, AV_PKT_DATA_ENCRYPTION_INFO, AV_PKT_DATA_ICC_PROFILE, AV_PKT_DATA_DOVI_CONF, AV_PKT_DATA_DYNAMIC_HDR10_PLUS, AV_PKT_DATA_IAMF_MIX_GAIN_PARAM, AV_PKT_DATA_IAMF_DEMIXING_INFO_PARAM, AV_PKT_DATA_IAMF_RECON_GAIN_INFO_PARAM, AV_PKT_DATA_PARAM_CHANGE, AV_PKT_DATA_JP_DUALMONO, AV_PKT_DATA_STRINGS_METADATA, AV_PKT_DATA_METADATA_UPDATE, AV_PKT_DATA_SKIP_SAMPLES, AV_PKT_DATA_MPEGTS_STREAM_ID, AV_PKT_DATA_SUBTITLE_POSITION, AV_PKT_DATA_MATROSKA_BLOCKADDITIONAL, AV_PKT_DATA_WEBVTT_IDENTIFIER, AV_PKT_DATA_WEBVTT_SETTINGS, AV_PKT_DATA_AFD, AV_PKT_DATA_S12M_TIMECODE, AV_PKT_DATA_FRAME_CROPPING, AV_PKT_DATA_DISPLAYMATRIX, AV_PKT_DATA_STEREO3D, AV_PKT_DATA_REPLAYGAIN, AV_PKT_DATA_AUDIO_SERVICE_TYPE, and AV_PKT_DATA_LCEVC. Prior side-data addition: the three IAMF packet side-data payloads parse FFmpeg's native AVIAMFParamDefinition envelope, validate expected definition type, native subblock offset/size/count, nonzero parameter_rate, nonzero subblock durations, mix-gain animation enum values, and expose typed mix-gain, demixing, and recon-gain subblock fields while preserving raw bytes and trailing data. Build-checked and WSL-smoked cargo-fuzz target avutil_core_models covers the packet timestamp, side-data lifecycle including empty standalone side-data array no-ops, zero-size packet/list side-data entries, packet-owned duplicate lookup/new/add/shrink, standalone beyond-packet-limit side-data append/replacement, raw no-buffer packet ref/clone copying, packet-owned side-data capacity and ERANGE no-mutation/caller-ownership invariants, zero-size packet payload input-padding invariants, PacketFifo move/ref/peek/read/drain invariants, displaymatrix raw-affine rotation and singular-axis invariants, packet flag constants, picture-type constants/chars, packet new-side-data allocation/replacement, strict shrink missing/oversize error-code invariants, standalone side-data array lifecycle including duplicate-type lookup/new/add/remove, packet/frame side-data bridge lifecycle, clone/ref/move/copy-props lifecycle, typed parser, side-data kind numeric values and display-name boundary cases, padded payload grow/shrink/writable/refcounted, payload/opaque_ref and property-preserving payload replacement, copy-props, and dictionary pack/unpack invariants including malformed invalid-data cases, IAMF params, encryption-info, encryption-init-info, strings-metadata, metadata-update, new-extradata, H.263 MB-info, palette, and Dynamic-HDR10+-packet invariants. Not complete: remaining ABI/media-integration oracle vectors and more differential media integration remain pending. The local FATE-runner smoke mapping executes the packet lib-unit filter only and does not count as upstream FATE parity."
