# Latest update: pinned libavcodec AVPacket side-data oracle coverage validates standalone nonzero flag behavior for `av_packet_side_data_new()` and `av_packet_side_data_add()`. FFmpeg 8.1.1 accepts both calls despite the documented currently-unused flags parameter, `new` exposes caller-initialized allocation bytes for comparison, and `add` replaces the first matching type while taking ownership of the caller buffer. Rust unit tests and avutil_core_models fuzz-smoke fixtures cover the same ignored-flag replacement shape.
# Latest update: pinned libavcodec AVPacket side-data oracle coverage validates packet-owned `av_packet_add_side_data()` ownership on capacity failure through `packet:side-add-capacity-overflow-owned`. FFmpeg returns ERANGE for a new type at `AV_PKT_DATA_NB` capacity while leaving the caller-owned buffer valid; Rust `Packet::try_add_side_data_owned` now consumes caller ownership only after the capacity check succeeds, with unit and avutil_core_models fuzz-smoke fixtures covering success consumption and failure preservation.
# Latest update: pinned libavcodec AVPacket side-data oracle coverage validates a capacity distinction between packet-owned side data and standalone `AVPacketSideData` arrays. Packet-owned `av_packet_add_side_data()` still rejects a new type at `AV_PKT_DATA_NB` with ERANGE, while standalone `av_packet_side_data_add()` accepts an out-of-range raw type past `AV_PKT_DATA_NB` and `av_packet_side_data_new()` can then replace that same raw type without growing the array. Rust `PacketSideDataList` now keeps that standalone behavior separate from the packet-owned capacity-checked API, with unit and avutil_core_models fuzz-smoke coverage.
