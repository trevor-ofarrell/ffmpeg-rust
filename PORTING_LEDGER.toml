notes = '''Frame skeleton validates required audio/video shape and exact plane sizes through the shared initial PixelFormat and SampleFormat models, reports tightly packed per-plane line sizes for the current audio/video format subset, stores optional PTS, non-dereferenceable AVFrame.opaque pointer metadata, BufferRef-backed AVFrame.opaque_ref user storage, and alpha_mode; can retain BufferRef-backed FrameSideData payloads with per-side-data Dictionary metadata; and can retain an optional AVFrame.hw_frames_ctx-shaped BufferRef with clone/take/replace/drop lifetime behavior. FrameData has an explicit Empty state for unreferenced frames, and Frame supports empty/default construction, unref(), ref_from(), and move_ref_from() to clear, clone/share, or move all current frame references while preserving BufferRef release timing. The latest pinned oracle rows prove the bounded av_container_fifo_alloc_avframe() surface: move writes reset the source, ref writes preserve the source while sharing references, reads drain entries, peek is non-mutating, drain preserves ordering, and invalid peek plus empty read return EINVAL in the selected oracle path. Previous pinned oracle rows prove rich av_frame_ref() behavior on a clean destination: payload buffers, side data, hw_frames_ctx, and opaque_ref are shared, properties are copied, and the source remains populated. That slice records that pre-populated av_frame_ref() destinations are outside the C helper contract; Rust unit and fuzz-smoke coverage treat ref_from() as a safe replacement wrapper that releases old destination owners first. Previous pinned oracle rows prove av_frame_move_ref() unreferences a pre-populated destination that owns payload, side data, hw_frames_ctx, and opaque_ref before moving source refs and resetting the source. Another pinned oracle row proves av_frame_make_writable() returns EINVAL without mutating empty frames; Rust exposes this through try_make_writable() while keeping make_writable() as a no-op-on-empty convenience wrapper. Another pinned oracle row proves unref() also resets a populated frame carrying payload, metadata, displaymatrix side data, hw_frames_ctx, and opaque_ref storage.

Current crop oracle rows also cover bitstream monow/monob/rgb4/bgr4 plus xv30be/v30xbe right/bottom-only behavior, with top/left crop preserved as frame crop metadata and no data-pointer advance.

