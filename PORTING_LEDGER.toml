ask-order lookup and current custom-map first-match lookup while returning typed invalid-argument errors or None for absent channels and invalid strings. AmbisonicChannelLayout adds current-subset order/native-extra-mask description, native-extra subset-mask, channel-by-index, count validation, and custom-equivalence helpers. This builds on source-checked current-subset subset-mask helpers exposing ChannelLayout::subset_mask and CustomChannelLayout::subset_native_mask, mirroring av_channel_layout_subset for native layouts, current explicit ambisonic layouts, and current custom maps by returning requested native mask bits whose channel IDs are present while ignoring custom names, duplicates, order, and non-native IDs. This builds on source-checked current-subset layout comparison helpers exposing ChannelLayout::is_equivalent_to, ChannelLayout::is_equivalent_to_custom, CustomChannelLayout::is_equivalent_to_native, and CustomChannelLayout::is_equivalent_to_custom, mirroring av_channel_layout_compare for native/custom layouts by requiring equal channel counts and equal channel IDs at each index while ignoring custom names. This builds on CustomChannelLayout::ambisonic_order and ambisonic description reduction for complete standard-order AMBI0..AMBI<N> prefixes with optional trailing channels, mirroring av_channel_layout_ambisonic_order and try_describe_ambisonic for the bounded Rust custom-map subset. It also builds on CustomChannelLayout::canonical_native_mask and canonical_native_layout coverage, mirroring masked_description/canonical_order: custom maps with no names, native raw channel IDs, and strictly increasing native order can reduce losslessly to a modeled native layout and describe as that layout name, while named, duplicate, out-of-order, unknown, unused, or user entries remain custom or return typed invalid-argument errors. This builds on ChannelCustom and CustomChannelLayout coverage for positive-length AVChannelCustom-style maps, default UNK entries, NONE rejection, 15-byte custom names with NUL rejection, duplicate raw channel IDs, first-match channel lookup, CH@name and @name lookup, and custom-order descriptions like N channels (FL@Left+UNK+AMBI1@W). It also builds on ChannelId coverage for AV_CHAN_NONE (-1), AV_CHAN_UNUSED (0x200 / UNSD), AV_CHAN_UNKNOWN (0x300 / UNK), AV_CHAN_AMBISONIC_BASE..END (0x400..0x7ff / AMBI0..AMBI1023), native Channel raw IDs/descriptions, and noncanonical USR-style user IDs, plus prior standalone native channel coverage and current named layout coverage listed in docs/architecture.md. Modeled native channels expose FFmpeg native mask bits, known layouts expose canonical masks and FL+FR-style channel strings, and ChannelLayout::parse accepts current named layouts plus '+'-separated known channel expressions that resolve exactly to one modeled layout while rejecting empty, NUL-containing, unknown, duplicate, and unsupported custom expressions. AudioFrame and avformat AudioStreamParameters derive ChannelLayoutSpec from channel count, preserve legacy native-only channel_layout() accessors, expose channel_layout_spec() for count-only defaults, and validate explicit native layouts by channel count. Build-checked cargo-fuzz target avutil_core_models covers parser-facing base-0 USR/AMBI channel strings, byte-preserving custom-name parsing/description/lookup/truncation fixtures, source-shaped leading-whitespace/trailing-junk numeric mask and count syntax, oracle-backed native/custom/unspecified default layout lookup, explicit ambisonic no-extra/native-extra parsing/description/index/subset/comparison/custom-target conversion behavior, arbitrary native-mask parsing/description/index/subset/comparison/custom-target conversion behavior, arbitrary native and custom channel-list parsing including escaped separators, quoted tokens, repeated-at custom names, and trailing separators, described-list count validation, bounded ambisonic branch parsing with native/custom extras and invalid nested ambisonic rejection, unspecified description/subset/index/comparison/custom-target conversion behavior, explicit layout validation, native source-order channel lookup, channel containment, channel-name/mask/layout-expression round trips across the current layout set, unsupported-expression rejection, standalone SDL/SDR/SSL/SSR/TTL/TTR name/mask fixtures, ChannelId raw/name/description fixtures, CustomChannelLayout fixtures including custom channel-list parsing, native canonicalization, valid/incomplete custom ambisonic maps, name-insensitive native/custom equivalence checks, current native/custom subset-mask fixtures, and custom string lookup fixtures, plus AudioFrame layout-spec integration, but sustained local fuzz execution is still pending. Remaining work includes full av_channel_layout_from_string grammar, broader parser tokenizer edge calibration, broader native/custom/ambisonic retyping, full AV_CHANNEL_ORDER_AMBISONIC comparison/index-string parity, unspecified string parsing and retype/oracle calibration, remaining layouts from ffmpeg -layouts, oracle inventory comparison, and broader sustained fuzzing. The local FATE-runner smoke mapping executes the channel_layout unit filter only; upstream `fate-channel_layout` now passes through the pinned WSL FFmpeg build cache and is wired in tests/fate/upstream-mappings.txt."
