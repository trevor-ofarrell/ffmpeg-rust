notes = "Initial shared sample format model covers the FFmpeg native u8/s16/s32/flt/dbl/s64 packed formats and u8p/s16p/s32p/fltp/dblp/s64p planar formats with FFmpeg-style naming, sample-byte sizing, bit-width reporting, packed versus planar plane counts, whole-frame byte sizing, per-plane payload-size validation, numeric-kind metadata, family metadata, packed/planar counterpart helpers, and av_get_sample_fmt_string-style table header/row formatting for `ffmpeg -sample_fmts`-style inventory output. The ignored `crates/avutil/tests/sample_format_oracle.rs` harness parses pinned `ffmpeg -sample_fmts` output and compares the current name/depth inventory against `SampleFormat::ALL`; `tests/differential/mappings.txt` exposes it as `avutil-sample-format|oracle-ffmpeg-sample-fmts`, and it passed locally through the pinned WSL oracle wrapper. SampleBufferLayout models source-checked pinned FFmpeg 8.1.1 av_samples_get_buffer_size-style storage accounting for Rust callers: packed formats produce one aligned line, planar formats produce one aligned line per channel, align=0 pads the effective sample count to a 32-sample boundary with byte alignment 1, and zero samples, zero channels, overlarge alignment, and line/total sizes outside FFmpeg's int return range fail with typed errors before callers treat the layout as valid. SampleArrayLayout and SamplePlaneRange model source-checked pinned av_samples_fill_arrays-style plane offsets for a contiguous Rust buffer: packed formats expose one plane at offset 0, planar formats expose one line-size-spaced plane per channel, extra trailing bytes in a caller buffer are ignored, and short buffers fail before slices are exposed. SampleAllocation, alloc_samples, and alloc_array_and_samples model source-checked pinned av_samples_alloc/av_samples_alloc_array_and_samples-style owned allocation as one contiguous writable BufferRef plus the same plane layout, with requested-sample-count silence initialization; Rust intentionally zeroes any align